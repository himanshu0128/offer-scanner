name: Nightly 30-Day Offer Scan

on:
  schedule:
    - cron: '0 2 * * *' # Runs every night at 02:00 UTC
  workflow_dispatch:

jobs:
  trigger-nightly-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Call Nightly Cron Endpoint
        run: |
          curl -f -X GET "${{ secrets.APP_URL }}/api/cron/nightly-scan" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
